# Lets the agent-sandbox controller accept our claim labels.
#
# The controller validates `additionalPodMetadata.labels` against an allowlist of label DOMAINS
# and falls back to `sandbox.users.io` alone when this ConfigMap is absent — so a claim carrying
# `agentconnect.md/agent` is rejected with `InvalidMetadata` and the Sandbox is never created.
# Observed exactly that on first apply.
#
# The controller reads this file once at STARTUP, so it needs a restart after this is created:
#
#   kubectl -n agentconnect rollout restart deploy/agent-sandbox-controller
#
# TWO things this file cannot know for you:
#
#   * Which namespace. It must live in the CONTROLLER's namespace, not necessarily this one —
#     upstream installs into `agent-sandbox-system`, while this cluster runs the controller in
#     `agentconnect`. Find it with:
#       kubectl get deploy -A | grep agent-sandbox-controller
#
#   * Whether it already exists. This value REPLACES the allowlist, including the built-in
#     `sandbox.users.io` fallback — which is why that domain is kept below. If the ConfigMap is
#     already there, merge your domain into the existing value instead of applying this file, or
#     you will silently revoke someone else's.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-sandbox-config
  namespace: agentconnect
data:
  # sandbox.users.io is the controller's built-in fallback, and setting this key
  # replaces it — dropping it would revoke any claim already relying on it.
  allowed-label-domains: sandbox.users.io,agentconnect.md
