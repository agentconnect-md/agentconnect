# The shim callback endpoint.
#
# Direction is the point: a sandbox pod dials OUT to this Service, and the daemon never dials into
# a sandbox. That is what lets a sandbox keep zero inbound rules. `AC_SHIM_ENDPOINT` in the
# SandboxTemplate must resolve to this name.
apiVersion: v1
kind: Service
metadata:
  name: agentconnect-daemon-shim
  namespace: agentconnect
spec:
  selector:
    app: agentconnect-daemon
  ports:
    - name: shim
      port: 8085
      targetPort: shim
      protocol: TCP
