<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1040"
  viewBox="0 0 1600 1040"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">AgentConnect daemon-centric architecture</title>
  <desc id="description">
    Direct platform connections terminate on daemons. Slack and Lark / Feishu HTTP
    callbacks, GitHub and generic webhooks, and webchat enter through an optional
    relay. The Control Plane manages orchestration and never carries live message
    traffic. Agents run locally behind ACP inside each daemon.
  </desc>

  <defs>
    <marker
      id="arrow-blue"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker
      id="arrow-green"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e" />
    </marker>
    <marker
      id="arrow-gray"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto-start-reverse"
    >
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="7"
        flood-color="#0f172a"
        flood-opacity="0.10"
      />
    </filter>
    <style>
      .title {
        font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #0f172a;
      }
      .subtitle {
        font: 400 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #475569;
      }
      .box-title {
        font: 700 29px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #0f172a;
      }
      .box-title-compact {
        font-size: 26px;
      }
      .box-copy {
        font: 500 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #334155;
      }
      .small {
        font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #475569;
      }
      .pill {
        font: 600 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #1e293b;
      }
      .arrow-label {
        font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #334155;
      }
      .no-live {
        font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #b91c1c;
      }
    </style>
  </defs>

  <rect width="1600" height="1040" rx="32" fill="#f8fafc" />
  <text x="64" y="68" class="title">AgentConnect: message paths</text>
  <text x="64" y="108" class="subtitle">
    Live content stays on the daemon and optional relay data plane.
  </text>

  <!-- Public ingress sources -->
  <g filter="url(#shadow)">
    <rect
      x="64"
      y="168"
      width="430"
      height="286"
      rx="24"
      fill="#ffffff"
      stroke="#94a3b8"
      stroke-width="2"
    />
  </g>
  <text x="96" y="215" class="box-title">Public ingress</text>
  <text x="96" y="248" class="small">Callbacks and browser sessions</text>

  <rect x="96" y="278" width="196" height="44" rx="12" fill="#f1f5f9" />
  <text x="194" y="307" text-anchor="middle" class="pill">Slack / Lark HTTP</text>
  <rect x="308" y="278" width="154" height="44" rx="12" fill="#f1f5f9" />
  <text x="385" y="307" text-anchor="middle" class="pill">GitHub hooks</text>
  <rect x="96" y="338" width="184" height="44" rx="12" fill="#f1f5f9" />
  <text x="188" y="367" text-anchor="middle" class="pill">Generic webhooks</text>
  <rect x="296" y="338" width="166" height="44" rx="12" fill="#f1f5f9" />
  <text x="379" y="367" text-anchor="middle" class="pill">Webchat</text>
  <text x="96" y="421" class="small">
    Requires a stable public HTTPS / WSS endpoint
  </text>

  <!-- Optional relay -->
  <g filter="url(#shadow)">
    <rect
      x="586"
      y="168"
      width="430"
      height="286"
      rx="24"
      fill="#ecfeff"
      stroke="#0f766e"
      stroke-width="3"
    />
  </g>
  <text x="618" y="215" class="box-title">Optional relay pool</text>
  <text x="618" y="258" class="box-copy">Verify public requests</text>
  <text x="618" y="294" class="box-copy">Resolve the target daemon</text>
  <text x="618" y="330" class="box-copy">Forward content over rd/*</text>
  <rect x="618" y="365" width="280" height="48" rx="12" fill="#ccfbf1" />
  <text x="758" y="396" text-anchor="middle" class="pill">No message persistence</text>

  <!-- Control Plane -->
  <g filter="url(#shadow)">
    <rect
      x="1108"
      y="168"
      width="428"
      height="286"
      rx="24"
      fill="#eef2ff"
      stroke="#4f46e5"
      stroke-width="3"
    />
  </g>
  <text x="1140" y="215" class="box-title">Control Plane + Web UI</text>
  <text x="1140" y="258" class="box-copy">Orchestration · registry · auth</text>
  <text x="1140" y="294" class="box-copy">
    Configuration · placement · telemetry
  </text>
  <text x="1140" y="330" class="box-copy">Bounded, on-demand read-back</text>
  <rect x="1140" y="365" width="254" height="48" rx="12" fill="#fee2e2" />
  <text x="1267" y="396" text-anchor="middle" class="no-live">
    NO LIVE MESSAGE PATH
  </text>

  <!-- Ingress and control arrows -->
  <line
    x1="494"
    y1="311"
    x2="586"
    y2="311"
    stroke="#0f766e"
    stroke-width="5"
    marker-end="url(#arrow-green)"
  />
  <text x="540" y="294" text-anchor="middle" class="arrow-label">HTTPS / WSS</text>

  <line
    x1="1016"
    y1="255"
    x2="1108"
    y2="255"
    stroke="#475569"
    stroke-width="4"
    stroke-dasharray="10 8"
    marker-start="url(#arrow-gray)"
    marker-end="url(#arrow-gray)"
  />
  <text x="1062" y="238" text-anchor="middle" class="arrow-label">control only</text>

  <!-- Direct platforms -->
  <g filter="url(#shadow)">
    <rect
      x="64"
      y="652"
      width="430"
      height="252"
      rx="24"
      fill="#ffffff"
      stroke="#94a3b8"
      stroke-width="2"
    />
  </g>
  <text x="96" y="701" class="box-title box-title-compact">
    Direct platform connections
  </text>
  <text x="96" y="745" class="box-copy">Slack Socket Mode</text>
  <text x="96" y="782" class="box-copy">Telegram · Discord</text>
  <text x="96" y="817" class="box-copy">Lark / Feishu Long Connection</text>
  <text x="96" y="851" class="small">Owned end to end by the daemon</text>
  <text x="96" y="881" class="small">No public callback endpoint required</text>

  <!-- Daemon -->
  <g filter="url(#shadow)">
    <rect
      x="586"
      y="600"
      width="950"
      height="368"
      rx="28"
      fill="#fff7ed"
      stroke="#c2410c"
      stroke-width="3"
    />
  </g>
  <text x="622" y="650" class="box-title">Daemon instances</text>
  <text x="622" y="687" class="small">
    Workspaces, sessions, and agent execution stay local
  </text>

  <rect
    x="622"
    y="728"
    width="250"
    height="130"
    rx="18"
    fill="#ffffff"
    stroke="#fb923c"
    stroke-width="2"
  />
  <text x="747" y="772" text-anchor="middle" class="pill">Platform + hook</text>
  <text x="747" y="805" text-anchor="middle" class="pill">routing</text>
  <text x="747" y="838" text-anchor="middle" class="small">direct API egress</text>

  <rect
    x="930"
    y="728"
    width="230"
    height="130"
    rx="18"
    fill="#ffffff"
    stroke="#fb923c"
    stroke-width="2"
  />
  <text x="1045" y="778" text-anchor="middle" class="pill">Local ACP</text>
  <text x="1045" y="813" text-anchor="middle" class="small">
    in-process / local IPC
  </text>

  <rect
    x="1218"
    y="728"
    width="282"
    height="130"
    rx="18"
    fill="#ffffff"
    stroke="#fb923c"
    stroke-width="2"
  />
  <text x="1359" y="772" text-anchor="middle" class="pill">Claude · Codex</text>
  <text x="1359" y="805" text-anchor="middle" class="pill">other ACP agents</text>
  <text x="1359" y="838" text-anchor="middle" class="small">
    local model processes
  </text>

  <line
    x1="872"
    y1="793"
    x2="930"
    y2="793"
    stroke="#c2410c"
    stroke-width="4"
    marker-end="url(#arrow-gray)"
  />
  <line
    x1="1160"
    y1="793"
    x2="1218"
    y2="793"
    stroke="#c2410c"
    stroke-width="4"
    marker-end="url(#arrow-gray)"
  />

  <!-- Direct and relay data paths -->
  <line
    x1="494"
    y1="778"
    x2="586"
    y2="778"
    stroke="#2563eb"
    stroke-width="5"
    marker-start="url(#arrow-blue)"
    marker-end="url(#arrow-blue)"
  />
  <text x="540" y="760" text-anchor="middle" class="arrow-label">direct I/O</text>

  <line
    x1="801"
    y1="454"
    x2="801"
    y2="600"
    stroke="#0f766e"
    stroke-width="5"
    marker-start="url(#arrow-green)"
    marker-end="url(#arrow-green)"
  />
  <text x="822" y="512" class="arrow-label">inbound content</text>
  <text x="822" y="540" class="arrow-label">webchat output returns</text>

  <!-- CP to daemon control path -->
  <line
    x1="1322"
    y1="454"
    x2="1322"
    y2="600"
    stroke="#4f46e5"
    stroke-width="5"
    marker-start="url(#arrow-blue)"
    marker-end="url(#arrow-blue)"
  />
  <text x="1344" y="500" class="arrow-label">control + telemetry</text>
  <text x="1344" y="528" class="arrow-label">bounded read-back</text>

  <!-- Direct provider egress -->
  <path
    d="M 622 890 H 540 V 500 H 280 V 454"
    fill="none"
    stroke="#475569"
    stroke-width="4"
    stroke-dasharray="10 8"
    marker-end="url(#arrow-gray)"
  />
  <rect x="292" y="481" width="270" height="58" rx="12" fill="#f8fafc" />
  <text x="427" y="505" text-anchor="middle" class="arrow-label">
    Slack / GitHub / provider API
  </text>
  <text x="427" y="530" text-anchor="middle" class="arrow-label">
    egress bypasses the relay
  </text>

  <text x="800" y="1010" text-anchor="middle" class="subtitle">
    The Control Plane orchestrates; it does not carry platform messages or ACP output
    streams.
  </text>
</svg>
