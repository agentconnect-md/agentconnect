packages:
  - 'packages/*'

# pnpm 11 only runs install/build scripts for dependencies approved here.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  better-sqlite3: false
  cpu-features: false
  onnxruntime-node: false
  protobufjs: false
  ssh2: false
  '@playwright/browser-chromium': false
  '@swc/core': false
  core-js: false

minimumReleaseAge: 60

# Pin vite/rolldown past 1.1.3: its native binding flaky-segfaults on process
# teardown under Linux CI (vitest crashes with SIGSEGV / exit 139 *after* all
# tests pass — rolldown is the only substantial native addon in the vitest
# process). vite 8.1.3 depends on rolldown ~1.1.3, so this pulls the 1.1.4 fix.
overrides:
  vite: 8.1.3
  rolldown: 1.1.4
