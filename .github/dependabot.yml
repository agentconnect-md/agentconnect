version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Upgrade the audited skills CLI together with its mirrored discovery and install contracts.
      - dependency-name: skills
      # Upgrade Node types across majors together with the manually managed Node runtime.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # Preset v10 requires writer v9; upgrade it together with semantic-release tooling.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
