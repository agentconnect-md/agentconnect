version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Upgrade Node types across majors together with the manually managed Node runtime.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # Preset v10 requires writer v9; upgrade it together with semantic-release tooling.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major
      # The daemon mirrors this CLI's discovery internals and asserts the exact version at build time; upgrade it manually with that audit.
      - dependency-name: skills
    groups:
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'

  # Pinned base images in the release Dockerfiles; it bumps a tag@digest only when the tag's version moves, not on a same-tag rebuild.
  - package-ecosystem: docker
    directories:
      - /docker
      - /packages/desktop/docker
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Upgrade Node across majors together with .nvmrc, engines and @types/node.
      - dependency-name: node
        update-types:
          - version-update:semver-major
