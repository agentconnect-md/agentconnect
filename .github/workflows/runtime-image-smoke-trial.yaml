name: Runtime image smoke trial

# Temporary, branch-scoped: builds both `-verify` targets against the release cache (read-only, no cache-to) and runs
# the host configuration check, to show the in-build smoke test passing on a hosted runner. Removed before merge.

on:
  push:
    branches: [ci/runtime-image-smoke-in-build]

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Verify ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [runtime-sandbox, runtime-sandbox-full]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify the runtime sandbox image configuration
        env:
          VARIANT: ${{ matrix.variant }}
          BUILD_ARGS: ''
        run: |
          set -eu
          set -- "$VARIANT"
          while IFS= read -r arg; do
            [ -z "$arg" ] || set -- "$@" --build-arg "$arg"
          done <<< "$BUILD_ARGS"
          node scripts/verify-runtime-image.mjs "$@"

      - name: Verify the runtime sandbox image inside the build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/runtime-sandbox.Dockerfile
          target: ${{ matrix.variant }}-verify
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-from: |
            type=registry,ref=ghcr.io/agentconnect-md/${{ matrix.variant }}:buildcache
            type=registry,ref=ghcr.io/agentconnect-md/${{ matrix.variant }}:buildcache-verify
