name: Release

# main → prerelease `x.y.z-rc.N` (npm dist-tag `rc`)
# release → stable `x.y.z` (npm dist-tag `latest`)
# See release.config.js for the branch/channel mapping.
#
# Every published version also ships Docker images: semantic-release exposes the
# vX.Y.Z(-rc.N) tag as a job output, then this workflow calls build.yaml to
# build/push the images and notify the configured workflow repository. Test
# summaries are deferred to the release job so its release notes are written
# first on the run summary page.
# App: needs RELEASE_APP_CLIENT_ID (var) + RELEASE_APP_PRIVATE_KEY
# (secret), installed on this repo with Contents + Issues write.
on:
  push:
    branches:
      - main
      - release
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  # Reuse the same quality gate as pull requests. The reusable workflow runs
  # Build, Check, Unit Test, and sharded Integration tests in parallel against
  # this exact SHA; the publishing job below waits for all of them.
  # `skip_sandbox` drops the kernel-sandbox suite here — the PR already ran it, and its
  # bwrap/apt setup is the leg whose failures would strand a merged commit unpublished.
  # `skip_windows` drops the Windows suite for the same reason: it is 15-23 min, it can fail
  # without ever acquiring a hosted runner, and the PR already ran it against this content.
  test:
    name: Test
    uses: ./.github/workflows/test.yaml
    with:
      defer_summaries: true
      skip_sandbox: true
      skip_windows: true

  release:
    needs: test
    outputs:
      version: ${{ steps.semantic-release.outputs.version }}
    # Serialize only publication, not the quality gate above. Never cancel:
    # semantic-release pushes the tag before the git note
    # (refs/notes/semantic-release), so cancellation between the two can strand
    # a tag without a note. The next queued job batches pending commits anyway.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm OIDC trusted publishing — no NPM_TOKEN needed
    steps:
      # Mint a short-lived GitHub App installation token for semantic-release to
      # publish the tag and stable GitHub Release. Scoped to this repo, expires
      # in ~1h, nothing long-lived to rotate.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # pnpm version is pinned via root package.json `packageManager`. OIDC
      # publishing needs pnpm >= 11.1.3 (drops the unresolved ${NODE_AUTH_TOKEN}
      # placeholder that setup-node writes to .npmrc); 11.9.0 satisfies this.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      # registry-url makes pnpm publish target npmjs; no token is set, so pnpm
      # authenticates via the OIDC id-token granted above.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: pnpm install --frozen-lockfile
      # Run directly under pnpm (not the docker action) so `pnpm publish` and the
      # workspace are available to @semantic-release/exec. No separate shared
      # package build step: the daemon's prepack build compiles its workspace
      # deps (@agentconnect.md/message and @agentconnect.md/protocol) first, so
      # their dist/ directories exist when the bundle runs.
      - name: Semantic Release
        id: semantic-release
        run: pnpm exec semantic-release
        env:
          # Tags and stable GitHub Releases are authored by the configured
          # release App. release.config.js exposes the published tag through
          # this step's `version` output; no-release runs leave it empty.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # GitHub orders job summaries by job completion. The quality-gate jobs
      # therefore return their markdown instead of publishing it before this
      # job starts; append it only after semantic-release writes the notes.
      - name: Append Unit Test summary
        if: ${{ !cancelled() && needs.test.outputs.build_test_summary != '' }}
        env:
          TEST_SUMMARY: ${{ needs.test.outputs.build_test_summary }}
        run: printf '\n---\n\n%s\n' "$TEST_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
      - name: Append integration test summary
        if: ${{ !cancelled() && needs.test.outputs.integration_test_summary != '' }}
        env:
          TEST_SUMMARY: ${{ needs.test.outputs.integration_test_summary }}
        run: printf '\n---\n\n%s\n' "$TEST_SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      # Stable releases only (the `release` branch): refresh the public API
      # reference on ReadMe using the configured external API contract.
      - name: Publish API docs to ReadMe
        if: github.ref == 'refs/heads/release'
        env:
          README_API_KEY: ${{ secrets.README_API_KEY }}
          PUBLIC_CP_URL: ${{ vars.PUBLIC_CP_URL }}
          OPENAPI_PATH_PREFIX: ${{ vars.OPENAPI_PATH_PREFIX }}
        run: |
          pnpm --filter @agentconnect.md/control-plane openapi:generate "${GITHUB_WORKSPACE}/openapi.json"
          npx --yes rdme@10 openapi upload "${GITHUB_WORKSPACE}/openapi.json" \
            --key "$README_API_KEY" \
            --slug openapi.json \
            --branch stable \
            --confirm-overwrite

  # Docker Bake publishes its own downstream summary after the release card.
  build-images:
    name: Build & Push Images
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yaml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
