name: TMP runtime image check stages

# Temporary trial for the in-build verify stages; removed before the PR is marked ready.
on:
  push:
    branches: [ci/runtime-image-check-stages]

permissions:
  contents: read
  packages: read

jobs:
  verify-stages:
    name: Build ${{ matrix.target }}-verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [runtime-sandbox, runtime-sandbox-full]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Reads the release cache, never writes it: no cache-to here.
      - name: Build the verify target
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/runtime-sandbox.Dockerfile
          target: ${{ matrix.target }}-verify
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-from: type=registry,ref=ghcr.io/agentconnect-md/${{ matrix.target }}:buildcache
