name: Publish Release

# Called under release.yaml's channel lock; never triggered by the tag it creates.
on:
  workflow_call:
    inputs:
      build_test_summary:
        type: string
        default: ''
      integration_test_summary:
        type: string
        default: ''

jobs:
  version:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Semantic Release
        id: release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      # Append deferred test summaries after the release notes, as in the original Release workflow.
      - name: Append Unit Test summary
        if: ${{ !cancelled() && inputs.build_test_summary != '' }}
        env:
          TEST_SUMMARY: ${{ inputs.build_test_summary }}
        run: printf '\n---\n\n%s\n' "$TEST_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
      - name: Append integration test summary
        if: ${{ !cancelled() && inputs.integration_test_summary != '' }}
        env:
          TEST_SUMMARY: ${{ inputs.integration_test_summary }}
        run: printf '\n---\n\n%s\n' "$TEST_SUMMARY" >> "$GITHUB_STEP_SUMMARY"

  artifacts:
    name: Publish Artifacts
    needs: version
    if: needs.version.outputs.version != ''
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build.yaml
    with:
      version: ${{ needs.version.outputs.version }}
      publish_npm: true
    secrets: inherit
