name: Build & Push Images

# Builds the control-plane / relay / web / external-memory / runtime-sandbox / daemon images for a RELEASE
# and pushes them to GHCR tagged with the semantic-release version (the git tag:
# `v1.2.3` stable, `v1.2.3-rc.4` prerelease). Stable releases also move `:latest`.
#
# Called by release.yaml after semantic-release publishes a version, so image
# publication appears in the same Release run. Plain pushes that don't produce
# a release don't call this workflow. Manual rebuild: workflow_dispatch, picking
# a vX.Y.Z(-rc.N) tag as the ref.
#
# Per-component effective versions: most releases don't touch every component,
# and a component whose build inputs are unchanged since the previous release
# on its channel would ship a behaviorally identical image under a new tag —
# creating redundant downstream workflow work. scripts/component-versions.sh
# computes, per component, the most recent same-channel tag (rc walks rc tags,
# stable walks stable tags) that actually changed it. The prepare job verifies
# that each unchanged component's effective image exists; a missing source is
# rebuilt at the current release instead of poisoning later aliases. Required
# components build concurrently on separate GitHub-hosted runners.
# `docker-bake.hcl` remains the source of truth for each target's Dockerfile,
# args, labels, contexts, tags, and platform. Unchanged components with a valid
# source skip the build and instead get this release's tag as an ALIAS of their
# effective image (same manifest digest), so `<comp>:<version>` exists for every
# component at every release regardless.
#
# The daemon and the runtime sandbox are confinement boundaries whose failure modes are silent —
# agent code running somewhere it should not, with every health check still green. Those two are
# built here, verified against the loaded image, and pushed only once their checks pass. The image
# a release publishes is therefore the image that was verified. A component skipped as unchanged
# is not re-verified: it was verified at the release that built it.
#
# After pushing, mints a short-lived GitHub App token for the configured
# workflow repository and fires an `images-pushed` repository_dispatch
# (payload `{version, sha, components: {controlPlane, web, relay, mem0, runtimeSandbox,
# mem0Backend}}` — the per-component tags the downstream workflow should
# consume; `== version` for components built by this release, whether changed or
# recovered from a missing source image). It reports artifact facts, not an
# instruction — what happens next is the workflow repository's concern and is
# documented there.

on:
  workflow_call:
    inputs:
      version:
        description: 'Release tag produced by semantic-release'
        required: true
        type: string
  workflow_dispatch:

concurrency:
  group: build-${{ inputs.version || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare image builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      latest: ${{ steps.meta.outputs.latest }}
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has_builds: ${{ steps.build-matrix.outputs.has_builds }}
      controlPlane: ${{ steps.build-matrix.outputs.controlPlane }}
      web: ${{ steps.build-matrix.outputs.web }}
      relay: ${{ steps.build-matrix.outputs.relay }}
      mem0: ${{ steps.build-matrix.outputs.mem0 }}
      mem0Backend: ${{ steps.build-matrix.outputs.mem0Backend }}
      runtimeSandbox: ${{ steps.build-matrix.outputs.runtimeSandbox }}
      daemon: ${{ steps.build-matrix.outputs.daemon }}
    steps:
      # Reusable calls receive the tag semantic-release just published. Manual
      # runs still derive it from the selected ref and reject branch refs, which
      # would otherwise mint a mutable image tag such as `main`.
      - name: Resolve release version
        id: meta
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="$RELEASE_VERSION"
          if [ -z "$version" ]; then
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "::error::Must run at a release tag ref, got ${GITHUB_REF}. Re-run picking a vX.Y.Z(-rc.N) tag."
              exit 1
            fi
            version="$GITHUB_REF_NAME"
          fi
          case "$version" in
            v[0-9]*) ;;
            *) echo "::error::'${version}' is not a vX.Y.Z(-rc.N) release tag."; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Only stable releases (no prerelease suffix) move `:latest`.
          case "$version" in
            *-*) echo "latest=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "latest=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      # Full history + tags: the effective-version walk below diffs stable tags
      # pairwise. This repo is small; the extra clone cost on rc builds is noise.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.version || github.ref }}

      # Per-component effective versions on this tag's channel (see the
      # header): a component whose inputs didn't change since the channel's
      # previous release keeps that older tag; only changed components build.
      - name: Resolve per-component effective versions
        id: components
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/component-versions.sh "$VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v4

      - name: Retry Buildx setup
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v4

      # Effective versions derived from Git are candidates until their manifests
      # resolve in GHCR. If a prior release failed before pushing one, rebuild the
      # unchanged inputs at this release and report the current version downstream.
      # The non-empty fallback keeps strategy.matrix valid when no builds are
      # required; has_builds prevents that sentinel from allocating a runner.
      - name: Select required image builds
        id: build-matrix
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.meta.outputs.version }}
          LATEST: ${{ steps.meta.outputs.latest }}
          GIT_SHA: ${{ github.sha }}
          CP_EFFECTIVE: ${{ steps.components.outputs.controlPlane }}
          WEB_EFFECTIVE: ${{ steps.components.outputs.web }}
          RELAY_EFFECTIVE: ${{ steps.components.outputs.relay }}
          MEM0_EFFECTIVE: ${{ steps.components.outputs.mem0 }}
          MEM0_BACKEND_EFFECTIVE: ${{ steps.components.outputs.mem0Backend }}
          RUNTIME_SANDBOX_EFFECTIVE: ${{ steps.components.outputs.runtimeSandbox }}
          DAEMON_EFFECTIVE: ${{ steps.components.outputs.daemon }}
          SETUP_VERSION: ${{ steps.components.outputs.setup }}
        run: |
          set -euo pipefail
          changed='[]'
          add_changed() {
            changed="$(jq -cn \
              --argjson current "$changed" \
              --arg target "$1" \
              '$current + [$target]')"
          }

          resolve_effective() {
            local output="$1" image="$2" target="$3" effective="$4" source_ref
            if [ "$effective" != "$VERSION" ]; then
              source_ref="${REGISTRY}/${OWNER}/${image}:${effective}"
              if docker buildx imagetools inspect "$source_ref" >/dev/null 2>&1; then
                echo "${image} unchanged since ${effective} — source image found"
              else
                echo "::warning::${source_ref} is unavailable; rebuilding ${image}:${VERSION}"
                effective="$VERSION"
              fi
            fi
            echo "${output}=${effective}" >> "$GITHUB_OUTPUT"
            if [ "$effective" = "$VERSION" ]; then
              add_changed "$target"
            fi
          }

          resolve_effective controlPlane control-plane control-plane "$CP_EFFECTIVE"
          resolve_effective web web web "$WEB_EFFECTIVE"
          resolve_effective relay relay relay "$RELAY_EFFECTIVE"
          resolve_effective mem0 memory-plugin-mem0 mem0 "$MEM0_EFFECTIVE"
          resolve_effective mem0Backend mem0-server mem0-backend "$MEM0_BACKEND_EFFECTIVE"
          # The runtime sandbox is what agent runtimes execute inside, not a service — but it is
          # pinned by the cluster manifests the same way, so it needs a tag at every release.
          resolve_effective runtimeSandbox runtime-sandbox runtime-sandbox "$RUNTIME_SANDBOX_EFFECTIVE"
          # The daemon pod image. Separate from the runtime sandbox: this runs the daemon, that
          # one is what an agent runtime executes inside.
          resolve_effective daemon daemon daemon "$DAEMON_EFFECTIVE"

          # Render the existing Bake definition so image-specific configuration
          # stays centralized even though each target builds in its own job.
          bake_config="${RUNNER_TEMP}/agentconnect-image-bake.json"
          docker buildx bake --print > "$bake_config"
          matrix="$(jq -c --argjson targets "$changed" '
            [
              $targets[] as $name
              | .target[$name] as $config
              | {
                  target: $name,
                  context: ($config.context // "."),
                  dockerfile: ($config.dockerfile // "Dockerfile"),
                  build_target: ($config.target // ""),
                  platforms: (($config.platforms // []) | join(",")),
                  tags: (($config.tags // []) | join("\n")),
                  build_args: (
                    ($config.args // {})
                    | to_entries
                    | map("\(.key)=\(.value)")
                    | join("\n")
                  ),
                  build_contexts: (
                    ($config.contexts // {})
                    | to_entries
                    | map("\(.key)=\(.value)")
                    | join("\n")
                  ),
                  labels: (
                    ($config.labels // {})
                    | to_entries
                    | map("\(.key)=\(.value)")
                    | join("\n")
                  ),
                  cache_ref: (
                    $config.tags[0]
                    | sub(":[^/]+$"; ":buildcache")
                  ),
                  # The two confinement boundaries carry an image-verification suite; the service
                  # images have none and push straight from the build.
                  verify: ({"daemon": "daemon", "runtime-sandbox": "runtime-sandbox"}[$name] // "")
                }
            ]
          ' "$bake_config")"

          if [ "$matrix" = '[]' ]; then
            echo "has_builds=false" >> "$GITHUB_OUTPUT"
            matrix='[{"target":"none","context":".","dockerfile":"docker/Dockerfile","build_target":"","platforms":"linux/amd64","tags":"","build_args":"","build_contexts":"","labels":"","cache_ref":"","verify":""}]'
          else
            echo "has_builds=true" >> "$GITHUB_OUTPUT"
          fi

          echo "matrix=$(jq -cn --argjson include "$matrix" '{include: $include}')" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build & push ${{ matrix.target }}
    needs: prepare
    if: ${{ needs.prepare.outputs.has_builds == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    # Registry cache refs are mutable performance hints. Serialize each target
    # across release runs so two channels cannot overwrite one simultaneously.
    concurrency:
      group: image-build-${{ matrix.target }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v4

      - name: Retry Buildx setup
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v4

      # A target-specific registry cache keeps all intermediate builder layers
      # (`mode=max`) without consuming the GitHub Actions cache quota.
      #
      # A target with a verification suite loads into the local daemon instead of pushing, so the
      # checks below run against the exact image this release publishes and a failure never
      # reaches the registry. The Push step at the end then publishes it from cache.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.build_target }}
          platforms: ${{ matrix.platforms }}
          push: ${{ matrix.verify == '' }}
          load: ${{ matrix.verify != '' }}
          tags: ${{ matrix.tags }}
          build-args: ${{ matrix.build_args }}
          build-contexts: ${{ matrix.build_contexts }}
          labels: ${{ matrix.labels }}
          cache-from: type=registry,ref=${{ matrix.cache_ref }}
          cache-to: type=registry,ref=${{ matrix.cache_ref }},mode=max

      - name: Resolve the built image reference
        if: matrix.verify != ''
        id: image
        env:
          TAGS: ${{ matrix.tags }}
        run: printf 'ref=%s\n' "$(printf '%s\n' "$TAGS" | head -1)" >> "$GITHUB_OUTPUT"

      # Against the BUILT image: non-root, tini as PID 1, git and CA certs present, no ACP runtime
      # smuggled in, and — the one that matters — `--k8s` refusing to start outside a pod instead
      # of quietly running agent code on the daemon's own host.
      - name: Verify the daemon image
        if: matrix.verify == 'daemon'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/verify-daemon-image.mjs "$IMAGE" "$VERSION"

      # Only the runtime sandbox needs a toolchain here: its smoke test's daemon side runs from
      # source. The other targets skip these steps.
      - uses: pnpm/action-setup@v6
        if: matrix.verify == 'runtime-sandbox'
        with:
          cache: true
      - uses: actions/setup-node@v6
        if: matrix.verify == 'runtime-sandbox'
        with:
          node-version-file: .nvmrc
      - name: Install
        if: matrix.verify == 'runtime-sandbox'
        run: pnpm install --frozen-lockfile

      # Against the BUILT image, not the Dockerfile: non-root, tini as PID 1, a root-owned shim the
      # runtime cannot rewrite, a self-contained shim bundle, no smuggled service-account token,
      # and the published runtime table agreeing with what the runtimes report.
      - name: Verify the runtime sandbox image and its runtime table
        if: matrix.verify == 'runtime-sandbox'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: node scripts/verify-runtime-image.mjs "$IMAGE"

      # The smoke test's DAEMON side imports the listener from source, which imports the workspace
      # packages by their built entry points.
      - name: Build the workspace packages the daemon side imports
        if: matrix.verify == 'runtime-sandbox'
        run: pnpm --filter "@agentconnect.md/daemon^..." build

      # The acceptance criterion: a real container, the real shim dialling back, the real ACP
      # runtime starting inside it, initialize and one session/new.
      - name: Smoke test through the shim
        if: matrix.verify == 'runtime-sandbox'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: pnpm --filter @agentconnect.md/daemon exec tsx scripts/smoke-runtime-image.mts "$IMAGE"

      # Publish a verified target once its checks have passed. Same inputs against the same builder,
      # so this re-exports from cache rather than rebuilding. It goes out through the action's own
      # push path deliberately: a plain `docker push` of the loaded image would publish these two
      # without the provenance attestation every directly-pushed target carries.
      - name: Push
        if: matrix.verify != ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.build_target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ matrix.tags }}
          build-args: ${{ matrix.build_args }}
          build-contexts: ${{ matrix.build_contexts }}
          labels: ${{ matrix.labels }}
          cache-from: type=registry,ref=${{ matrix.cache_ref }}

  finalize:
    name: Finalize image tags
    needs:
      - prepare
      - build-images
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ needs.prepare.outputs.version }}
      controlPlane: ${{ needs.prepare.outputs.controlPlane }}
      web: ${{ needs.prepare.outputs.web }}
      relay: ${{ needs.prepare.outputs.relay }}
      mem0: ${{ needs.prepare.outputs.mem0 }}
      mem0Backend: ${{ needs.prepare.outputs.mem0Backend }}
      runtimeSandbox: ${{ needs.prepare.outputs.runtimeSandbox }}
      daemon: ${{ needs.prepare.outputs.daemon }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v4

      - name: Retry Buildx setup
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v4

      # Components skipped above still get this release's tag: an alias of the
      # effective image (imagetools create adds tags to the SAME manifest
      # digest — no build, no storage). So `--set image.tag=<version>` (manual
      # full syncs, rollbacks) resolves for every component at every release
      # tag, while the per-component tags in the dispatch payload remain the
      # restart-avoiding references. On stable releases the alias also moves
      # `:latest`, keeping parity with the built components. The prepare job has
      # already promoted unavailable effective images to this release's build.
      #
      # Baked build fingerprints (web's VERSION/GIT_SHA/BUILD_TIME → the
      # profile-page fingerprint) are intrinsic to the image and therefore stay
      # at the EFFECTIVE version's commit in an aliased tag — deliberately: the bits
      # ARE that commit's build, and the pod's image tag says the same thing.
      # Re-baking the train's sha into byte-identical code would relabel an
      # unchanged image and force the pointless rebuild this step exists to
      # avoid.
      - name: Alias unchanged components to this release tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          LATEST: ${{ needs.prepare.outputs.latest }}
          CP_EFFECTIVE: ${{ needs.prepare.outputs.controlPlane }}
          WEB_EFFECTIVE: ${{ needs.prepare.outputs.web }}
          RELAY_EFFECTIVE: ${{ needs.prepare.outputs.relay }}
          MEM0_EFFECTIVE: ${{ needs.prepare.outputs.mem0 }}
          MEM0_BACKEND_EFFECTIVE: ${{ needs.prepare.outputs.mem0Backend }}
          RUNTIME_SANDBOX_EFFECTIVE: ${{ needs.prepare.outputs.runtimeSandbox }}
          DAEMON_EFFECTIVE: ${{ needs.prepare.outputs.daemon }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          alias_unchanged() {
            comp="$1"; effective="$2"
            if [ "$effective" = "$VERSION" ]; then
              return 0
            fi
            echo "${comp} unchanged since ${effective} — aliasing ${comp}:${VERSION} to it"
            set -- -t "${REGISTRY}/${OWNER}/${comp}:${VERSION}"
            if [ "$LATEST" = "true" ]; then
              set -- "$@" -t "${REGISTRY}/${OWNER}/${comp}:latest"
            fi
            docker buildx imagetools create "$@" "${REGISTRY}/${OWNER}/${comp}:${effective}"
          }
          alias_unchanged control-plane "$CP_EFFECTIVE"
          alias_unchanged web "$WEB_EFFECTIVE"
          alias_unchanged relay "$RELAY_EFFECTIVE"
          alias_unchanged memory-plugin-mem0 "$MEM0_EFFECTIVE"
          alias_unchanged mem0-server "$MEM0_BACKEND_EFFECTIVE"
          alias_unchanged runtime-sandbox "$RUNTIME_SANDBOX_EFFECTIVE"
          alias_unchanged daemon "$DAEMON_EFFECTIVE"

  # The Helm chart rides the same release train as the images: chart version = the release
  # with the `v` stripped (OCI/SemVer form), appVersion = the release tag (the image-tag
  # form its templates default to). Published after `finalize` so a chart version never
  # exists without its images, and before the dispatch below so a consumer deploying on
  # that signal can pull the chart at the version it names.
  publish-chart:
    name: Publish Helm chart
    needs:
      - prepare
      - finalize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.version }}

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin <<< "$TOKEN"

      - name: Package and push the chart
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          chart_version="${VERSION#v}"
          helm package charts/agentconnect \
            --version "$chart_version" --app-version "$VERSION" \
            --destination "$RUNNER_TEMP"
          helm push "${RUNNER_TEMP}/agentconnect-${chart_version}.tgz" "oci://${REGISTRY}/${OWNER}/charts"

  notify-workflow:
    name: Notify workflow
    needs:
      - finalize
      - publish-chart
    runs-on: ubuntu-latest
    steps:
      - name: Resolve workflow repository
        id: workflow-repository
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ secrets.WORKFLOW_REPOSITORY }}
        run: |
          if [[ ! "${WORKFLOW_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::WORKFLOW_REPOSITORY must be set to owner/repository"
            exit 1
          fi
          workflow_owner="${WORKFLOW_REPOSITORY%%/*}"
          workflow_name="${WORKFLOW_REPOSITORY#*/}"
          echo "::add-mask::${workflow_owner}"
          echo "::add-mask::${workflow_name}"
          echo "owner=${workflow_owner}" >> "$GITHUB_OUTPUT"
          echo "name=${workflow_name}" >> "$GITHUB_OUTPUT"

      - name: Mint workflow repository GitHub App token
        id: workflow-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ steps.workflow-repository.outputs.owner }}
          repositories: ${{ steps.workflow-repository.outputs.name }}

      # `components` carries each component's effective tag on this channel
      # (== version for components built because they changed or their source
      # image was unavailable). Workflows that pin per-component tags can
      # consume the independent values;
      # consumers without per-component support can keep using `version` because
      # the alias step above guarantees every component resolves at it.
      - name: Notify workflow repository of pushed images
        env:
          DISPATCH_TOKEN: ${{ steps.workflow-app-token.outputs.token }}
          WORKFLOW_REPOSITORY: ${{ secrets.WORKFLOW_REPOSITORY }}
          VERSION: ${{ needs.finalize.outputs.version }}
          SHA: ${{ github.sha }}
          CP: ${{ needs.finalize.outputs.controlPlane }}
          WEB: ${{ needs.finalize.outputs.web }}
          RELAY: ${{ needs.finalize.outputs.relay }}
          MEM0: ${{ needs.finalize.outputs.mem0 }}
          MEM0_BACKEND: ${{ needs.finalize.outputs.mem0Backend }}
          RUNTIME_SANDBOX: ${{ needs.finalize.outputs.runtimeSandbox }}
          DAEMON: ${{ needs.finalize.outputs.daemon }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${WORKFLOW_REPOSITORY}/dispatches" \
            -d "{\"event_type\":\"images-pushed\",\"client_payload\":{\"version\":\"${VERSION}\",\"sha\":\"${SHA}\",\"components\":{\"controlPlane\":\"${CP}\",\"web\":\"${WEB}\",\"relay\":\"${RELAY}\",\"mem0\":\"${MEM0}\",\"mem0Backend\":\"${MEM0_BACKEND}\",\"runtimeSandbox\":\"${RUNTIME_SANDBOX}\",\"daemon\":\"${DAEMON}\"}}}"
