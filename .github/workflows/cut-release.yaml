name: Cut Release

# Force-moves the `release` branch to the chosen commit, which triggers Release's stable channel (vX.Y.Z).
# The ref update uses the release App's token: one made with the built-in GITHUB_TOKEN would not trigger Release.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit to be cut to final release, defaults to head'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # The refs API takes only a full SHA, so resolve the input (short SHA, branch, or tag) first.
      - name: Move release branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMIT: ${{ github.event.inputs.commit }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/${COMMIT:-$GITHUB_SHA}" --jq .sha)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/release" -f sha="$sha" -F force=true --jq .object.sha
          echo "Moved \`release\` to \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
