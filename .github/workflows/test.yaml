name: Test

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # Release calls this workflow as its quality gate for main/release pushes.
  # Keeping the jobs here avoids duplicating CI logic between PRs and releases.
  workflow_call:
    inputs:
      defer_summaries:
        description: 'Return job summaries to the caller instead of publishing them here'
        required: false
        type: boolean
        default: false
      skip_sandbox:
        description: 'Skip the Linux kernel sandbox suite (PR runs always keep it)'
        required: false
        type: boolean
        default: false
      skip_windows:
        description: 'Skip the Windows unit suite (PR runs always keep it)'
        required: false
        type: boolean
        default: false
    outputs:
      build_test_summary:
        description: 'Unit test summary markdown'
        value: ${{ jobs.unit.outputs.summary }}
      integration_test_summary:
        description: 'Integration test summary markdown'
        value: ${{ format('{0}{1}', jobs.integration.outputs.summary_1, jobs.integration.outputs.summary_2) }}

# Cancel superseded runs for the same PR (a newer push makes the old one moot).
# Reusable release-gate calls use a run-scoped group so their tests can proceed
# independently; release.yaml serializes only the publishing job.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Keep builds, static checks, Docker-free unit tests, and the Docker-bound
# integration suite separate so all four workloads can be scheduled independently.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: packages/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/web/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm -r prisma:generate
      - name: Build
        env:
          pnpm_config_enable_pre_post_scripts: false
        run: pnpm build

  # Build only typechecks what each package emits, so this no-emit pass owns the
  # test surface of every package (plus the tsdown bundles, which never typecheck).
  # Web is left out: `next build` already checks its whole tsconfig, tests included.
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install
        run: pnpm install --frozen-lockfile
      # Run before any workspace build so source-checkout export resolution
      # cannot be accidentally masked by protocol/connection dist artifacts.
      - name: Evaluation config validation · clean checkout
        env:
          PROMPTFOO_DISABLE_TELEMETRY: '1'
        run: pnpm eval:validate
      - name: Generate Prisma client
        run: pnpm -r prisma:generate
      - name: Lint · Format · Typecheck
        env:
          pnpm_config_enable_pre_post_scripts: false
        run: pnpm --workspace-concurrency=5 run "/^(lint|format:check|typecheck:ci)$/"

  # The Helm chart's own gate: lint plus the render contract in
  # scripts/test-chart-render.rb (both preinstalled on the hosted image — helm, ruby).
  # It runs unconditionally: chart edits are rare but every release publishes the chart,
  # so a broken chart must fail the same gate that blocks a broken package.
  chart:
    name: Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: helm lint
        run: helm lint charts/agentconnect
      - name: Render contract
        run: ruby scripts/test-chart-render.rb

  # Keep the fast, Docker-free suites away from the resource-heavy build group
  # so their short per-test timeouts measure code rather than runner contention.
  unit:
    name: Unit Test
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.export-summary.outputs.markdown }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm -r prisma:generate
      # NOTE: this job runs bwrap-free on purpose. Suites that need the OS
      # sandbox self-skip here and run in the dedicated `sandbox-linux` job
      # below; keeping bwrap out prevents the broad unit suite from changing
      # behavior based on the runner's available kernel sandbox.
      - name: Unit tests
        env:
          CAPTURED_JOB_SUMMARY: ${{ runner.temp }}/unit-test-summary.md
          pnpm_config_enable_pre_post_scripts: false
          VITEST_JOB_SUMMARY_DIR: ${{ runner.temp }}
        run: GITHUB_STEP_SUMMARY="$CAPTURED_JOB_SUMMARY" pnpm test:unit
      - name: Merge unit test summaries
        if: ${{ !cancelled() }}
        env:
          CAPTURED_JOB_SUMMARY: ${{ runner.temp }}/unit-test-summary.md
          VITEST_JOB_SUMMARY_DIR: ${{ runner.temp }}
        run: |
          GITHUB_STEP_SUMMARY="$CAPTURED_JOB_SUMMARY" node scripts/merge-vitest-summaries.mjs \
            'Unit test report' \
            'message=@agentconnect.md/message' \
            'protocol=@agentconnect.md/protocol' \
            'activation-policy=@agentconnect.md/activation-policy' \
            'connection=@agentconnect.md/connection' \
            'control-plane=@agentconnect.md/control-plane' \
            'relay=@agentconnect.md/relay' \
            'daemon=@agentconnect.md/daemon' \
            'cli=@agentconnect.md/cli' \
            'setup=@agentconnect.md/setup' \
            'k8s-client=@agentconnect.md/k8s-client'
      - name: Publish unit test summary
        if: ${{ !cancelled() && !inputs.defer_summaries }}
        env:
          CAPTURED_JOB_SUMMARY: ${{ runner.temp }}/unit-test-summary.md
        run: cat "$CAPTURED_JOB_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
      - name: Export unit test summary
        id: export-summary
        if: ${{ !cancelled() && inputs.defer_summaries }}
        env:
          CAPTURED_JOB_SUMMARY: ${{ runner.temp }}/unit-test-summary.md
        run: |
          {
            echo 'markdown<<__AGENTCONNECT_UNIT_TEST_SUMMARY__'
            cat "$CAPTURED_JOB_SUMMARY"
            echo '__AGENTCONNECT_UNIT_TEST_SUMMARY__'
          } >> "$GITHUB_OUTPUT"

  # Whether this PR can change what the Windows job tests at all. It runs ~15-23 min against ~3 for
  # the slowest Linux job, so it sets the whole workflow's wall clock — and most PRs here never touch
  # the daemon/CLI closure. Costs one ~30 s Linux job to spare the other PRs that wait. Non-PR events
  # and any diff this cannot read answer yes, so the gate fails open, never silently off.
  windows-scope:
    name: Windows Scope
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_windows }}
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Does this diff reach the daemon/CLI closure?
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          reaches() { echo 'changed=true' >> "$GITHUB_OUTPUT"; exit 0; }
          [ "${{ github.event_name }}" = 'pull_request' ] || reaches
          [ -n "$BASE" ] && [ -n "$HEAD" ] || reaches
          files=$(git diff --name-only "$BASE...$HEAD") || reaches
          # Listed by what CANNOT reach the job: the packages nothing in the daemon/CLI closure
          # depends on, plus docs and the chart. Everything else runs it — a new root config, a new
          # script, a new shared package are all in scope without anyone remembering to list them.
          if grep -qvE '^(packages/(web|control-plane|relay|setup|memory-plugin-mem0|observability)/|charts/|docs/)' <<<"$files"; then
            reaches
          fi
          echo 'changed=false' >> "$GITHUB_OUTPUT"

  # The two packages with real Windows surface — the daemon (runtimes, skills, spawn driver, IPC
  # paths) and the CLI (junction-based version pointers) — on a Windows runner. `windows-latest`
  # rather than a win32-simulating unit test: the failures this catches are the ones only a real
  # Win32 filesystem and process model produce.
  #
  # Release callers pass `skip_windows` for the same reason they pass `skip_sandbox`: the PR already
  # ran it, and a 15-23 min Windows leg that can lose its own runner would strand a merged commit
  # unpublished. `inputs` is empty on `pull_request`, so the unset input reads falsy and PRs run it.
  #
  # No `prisma:generate` step: neither package imports the generated client.
  unit-windows:
    # MEASUREMENT — three samples per arm in one run. This job's `tests` total has come back
    # 873, 1022, 1037, 1048 and 1135 s on content that differs only in the store's backing, so a
    # single pair against a single baseline resolves nothing, which is how the first reading of
    # this change came out at -26% and the second at +9%.
    name: Unit Test (Windows) ${{ matrix.backing }}-${{ matrix.sample }}
    needs: windows-scope
    if: ${{ needs.windows-scope.outputs.changed == 'true' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        backing: [file, memory]
        sample: [1, 2, 3]
    # The daemon suite alone runs ~20 min here against ~3 on Linux — Windows filesystem and
    # process-spawn cost, not extra work — so the cap is set well clear of it rather than near it.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # The daemon suite creates and deletes a temporary root, a SQLite database and its two WAL
      # siblings per store, thousands of times over, and real-time scanning charges for each write.
      # Advisory, so `continue-on-error`: a runner image without Defender must not fail the job here.
      - name: Exempt the workspace from real-time scanning
        continue-on-error: true
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", "$env:TEMP"
          Add-MpPreference -ExclusionProcess 'node.exe', 'git.exe'
      # Before checkout: the runner's Git installs with `core.autocrlf=true`, which would rewrite
      # every fixture's line endings and diverge golden files from the Linux jobs' bytes.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          # Its own primary key, keyed by the closure it stores rather than by the lockfile alone.
          # Nothing shares this OS today, but the rule is the one the two narrowed Linux jobs
          # follow: a job that installs a subset never saves under the shared key.
          cache_dependency_path: |
            pnpm-lock.yaml
            packages/daemon/package.json
            packages/cli/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # Only what this job runs, plus its workspace closure — 7 of the 14 projects. A full install
      # also fetches the console's Next.js and the control plane's Prisma, which this job can never
      # reach, and Windows pays for every one of those files twice: extracting the store cache, then
      # materializing node_modules. Safe to narrow because the three imports that leave these two
      # packages — `evals/games/mcp-client.ts` and the two `docker/runtime-sandbox` helpers — use
      # only Node built-ins, as do the summary scripts, and both packages carry their own vitest.
      # The other jobs keep the full install: every Linux job shares one cache key, so a partial
      # store saved by one would cost the full-install jobs a re-download on every run.
      - name: Install
        run: pnpm install --frozen-lockfile --filter "@agentconnect.md/daemon..." --filter "@agentconnect.md/cli..."
      # `os.tmpdir()` resolves onto C:, this runner's network-attached OS disk, while the workspace,
      # the pnpm store and `RUNNER_TEMP` already sit on D:, which is storage local to the host. The
      # suite builds ~1400 stores and every fixture root through that name, so the one thing writing
      # the most small files was the one thing left on the slower disk. Measured three samples per
      # arm in one run: 1399 s of test time on C against 857 s on D, ranges disjoint. Node reads
      # TEMP first on win32; TMP is set too because other tooling reads that one.
      - name: Put the suite's temp root on the host-local disk
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # POSIX-only files self-skip via `it.skipIf(process.platform === 'win32')`, or — when every
      # case in the file is POSIX-only — via `WINDOWS_EXCLUDED` in that package's vitest.config.ts.
      #
      # One step per package, the second running even after the first fails: a recursive `pnpm run`
      # aborts its siblings on the first failure, which would hide one package behind the other.
      - name: Daemon unit tests
        env:
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/windows-unit-test-summary.md
          pnpm_config_enable_pre_post_scripts: false
          VITEST_JOB_SUMMARY_DIR: ${{ runner.temp }}
          AGENTCONNECT_TEST_STORE_MEMORY: ${{ matrix.backing == 'memory' && '1' || '' }}
        run: pnpm --filter @agentconnect.md/daemon test:unit
      - name: CLI unit tests
        if: ${{ !cancelled() }}
        env:
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/windows-unit-test-summary.md
          pnpm_config_enable_pre_post_scripts: false
          VITEST_JOB_SUMMARY_DIR: ${{ runner.temp }}
        run: pnpm --filter @agentconnect.md/cli test:unit
      - name: Merge Windows unit test summaries
        if: ${{ !cancelled() }}
        env:
          CAPTURED_JOB_SUMMARY: ${{ runner.temp }}/windows-unit-test-summary.md
          VITEST_JOB_SUMMARY_DIR: ${{ runner.temp }}
        run: |
          GITHUB_STEP_SUMMARY="$CAPTURED_JOB_SUMMARY" node scripts/merge-vitest-summaries.mjs \
            'Windows unit test report' \
            'daemon=@agentconnect.md/daemon' \
            'cli=@agentconnect.md/cli'
      - name: Publish Windows unit test summary
        if: ${{ !cancelled() && !inputs.defer_summaries }}
        env:
          CAPTURED_JOB_SUMMARY: ${{ runner.temp }}/windows-unit-test-summary.md
        run: cat "$CAPTURED_JOB_SUMMARY" >> "$GITHUB_STEP_SUMMARY"

  # The evaluation gates, off the Unit Test job's critical path. They are ~48s of the ~3m27s that
  # job took, and it is the slowest in the workflow, so they buy back most of that on their own
  # runner. `evals/README.md` calls these the deterministic, credential-free layer — the real
  # Promptfoo evaluation (`eval:addons`) needs model credentials and never ran here.
  #
  # No `prisma:generate` step: this closure reaches evals/, packages/daemon and the protocol-side
  # packages, none of which import the generated client.
  evals:
    name: Evaluation Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install
        run: pnpm install --frozen-lockfile
      # Evaluation contracts, the Collaboration Arena gate (collaboration-arena.md §14 step 3), and
      # cross-surface activation parity (docs/designs/activation-parity.md) — a PR that changes
      # "who does this message activate" on one surface must either keep every leg green or declare
      # the divergence in evals/parity/spec.ts with a citation.
      #
      # One Vitest run rather than three: `scripts/eval-gates.test.mjs` keeps the merged list equal
      # to the union of the three per-gate scripts, which stay for local use.
      - name: Evaluation gates
        env:
          PROMPTFOO_DISABLE_TELEMETRY: '1'
        run: pnpm eval:gates

  # Exercise the daemon's core sandbox boundaries and confined skills pipeline
  # under the real Linux kernel sandbox. These cases self-skip in the bwrap-free
  # Unit Test job above and run for real here on a bwrap-capable runner.
  # PR-only gate: release callers pass `skip_sandbox` so it cannot block publication.
  # `inputs` is empty on `pull_request`, so the unset input reads falsy and PRs run it.
  sandbox-linux:
    name: Sandbox (Linux)
    if: ${{ !inputs.skip_sandbox }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          # Its own PRIMARY key. The default one is shared by every job on this runner OS, so the
          # filtered subset this job stores would otherwise be what `build`, `check` and `unit`
          # restore on every run. Only the primary: the action's restore-key prefix stops before the
          # hash, so on the one run after a lockfile change a full-install job can still fall back
          # onto this store and re-fetch what it misses.
          cache_dependency_path: |
            pnpm-lock.yaml
            packages/daemon/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # Only the daemon and its workspace closure — this job runs nothing else. No Prisma step
      # either, for the reason the Windows job gives: the daemon never imports the generated client,
      # and `pnpm -r` would now reach a control plane this install deliberately left out.
      - name: Install
        run: pnpm install --frozen-lockfile --filter "@agentconnect.md/daemon..."
      # The only apt on the critical path. A runner's regional mirror can black-hole a fetch for
      # hours, and the acquire timeouts below do NOT rescue that: apt falls through to upstream,
      # but per index file, so the step cap expires before the fallbacks finish. Drop the mirror
      # list to upstream first and the timeouts go back to covering the ordinary case.
      - name: Install and enable the Linux kernel sandbox
        timeout-minutes: 5
        env:
          APT_OPTS: -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=2
        run: |
          # One package set on one job: reaching upstream directly is not a bandwidth decision.
          # An `if` and not `[ … ] &&`, which under this shell's -e fails the step when absent.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends bubblewrap ripgrep socat
          # Ubuntu 24.04 runners restrict unprivileged userns via AppArmor; bwrap (so the SRT sandbox) needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # Fail loudly rather than letting sandbox-dependent suites silently skip if bwrap cannot start.
          bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc /usr/bin/true
      - name: Core sandbox suite
        run: pnpm --filter @agentconnect.md/daemon exec vitest run test/sandbox.test.ts
      - name: Confined skills suites
        run: >
          pnpm --filter @agentconnect.md/daemon exec vitest run
          test/skills-cli-golden.test.ts
          test/unified-skills.test.ts
          test/skill-workspace-lock.test.ts
          test/skill-install-ledger.test.ts

  # The daemon's store suites again, with `LocalStore` opened over `PostgresSyncDatabase`
  # instead of `node:sqlite`, against a Testcontainers `postgres:16-alpine`. The pool runs
  # that SQL for real, so a SQLite-only construct fails here rather than on a cluster.
  # Needs Docker, so it gets its own runner off the critical path.
  daemon-store-postgres:
    name: Daemon Store (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          # Its own primary key, for the reason the sandbox job gives.
          cache_dependency_path: |
            pnpm-lock.yaml
            packages/daemon/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # Only the daemon and its workspace closure — this job runs nothing else.
      - name: Install
        run: pnpm install --frozen-lockfile --filter "@agentconnect.md/daemon..."
      - name: Daemon store suites on PostgreSQL
        run: pnpm --filter @agentconnect.md/daemon test:store:postgres

  # control-plane integration tests against a real Postgres booted by
  # Testcontainers. Each Vitest worker gets an isolated database cloned from one
  # migrated template, so files run concurrently without cross-test TRUNCATEs.
  # Each shard needs Docker, so it gets its own runner off the critical path.
  # No build needed — the suite resolves workspace deps from source.
  integration:
    name: Integration tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    outputs:
      summary_1: ${{ steps.export-summary.outputs.summary_1 }}
      summary_2: ${{ steps.export-summary.outputs.summary_2 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1/2'
            summary_output: summary_1
          - shard: '2/2'
            summary_output: summary_2
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm -r prisma:generate
      - name: Integration tests
        env:
          CAPTURED_JOB_SUMMARY: ${{ runner.temp }}/integration-test-summary.md
          VITEST_JOB_SUMMARY_DIR: ${{ runner.temp }}
        run: GITHUB_STEP_SUMMARY="$CAPTURED_JOB_SUMMARY" pnpm --filter @agentconnect.md/control-plane test:int --shard=${{ matrix.shard }}
      - name: Merge integration test summaries
        if: ${{ !cancelled() }}
        env:
          CAPTURED_JOB_SUMMARY: ${{ runner.temp }}/integration-test-summary.md
          VITEST_JOB_SUMMARY_DIR: ${{ runner.temp }}
        run: |
          GITHUB_STEP_SUMMARY="$CAPTURED_JOB_SUMMARY" node scripts/merge-vitest-summaries.mjs \
            'Integration test report · shard ${{ matrix.shard }}' \
            'control-plane=@agentconnect.md/control-plane'
      - name: Publish integration test summary
        if: ${{ !cancelled() && !inputs.defer_summaries }}
        env:
          CAPTURED_JOB_SUMMARY: ${{ runner.temp }}/integration-test-summary.md
        run: cat "$CAPTURED_JOB_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
      - name: Export integration test summary
        id: export-summary
        if: ${{ !cancelled() && inputs.defer_summaries }}
        env:
          CAPTURED_JOB_SUMMARY: ${{ runner.temp }}/integration-test-summary.md
        run: |
          {
            echo '${{ matrix.summary_output }}<<__AGENTCONNECT_INTEGRATION_TEST_SUMMARY__'
            cat "$CAPTURED_JOB_SUMMARY"
            echo '__AGENTCONNECT_INTEGRATION_TEST_SUMMARY__'
          } >> "$GITHUB_OUTPUT"
