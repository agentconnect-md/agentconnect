{{- if and .Values.daemonPool.enabled .Values.computerPool.enabled }}
{{- if not (or .Values.apiHost .Values.publicUrl) }}{{ fail "computerPool.enabled needs apiHost or publicUrl: desktop pods register with the Control Plane's public URL" }}{{ end }}
{{- $agentsNamespace := .Values.daemonPool.sandboxNamespace | default .Release.Namespace }}
{{- $sandboxNamespace := include "agentconnect.computerNamespace" . }}
{{- $pool := .Values.computerPool }}
{{- $root := $pool.rootAccess.enabled }}
{{- $ownNamespace := and (ne $sandboxNamespace $agentsNamespace) (ne $sandboxNamespace .Release.Namespace) }}
{{- if and $root (eq $sandboxNamespace $agentsNamespace) (ne $agentsNamespace .Release.Namespace) }}{{ fail "computerPool.rootAccess.enabled needs computerPool.namespace: the agents namespace enforces the restricted Pod Security level, which refuses sudo" }}{{ end }}
{{- if $ownNamespace }}
# Desktops' own namespace: `baseline` only when they get root, with the same nothing-in, nothing-out floor as the agents namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $sandboxNamespace }}
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: {{ ternary "baseline" "restricted" $root }}
    pod-security.kubernetes.io/audit: {{ ternary "baseline" "restricted" $root }}
    pod-security.kubernetes.io/warn: {{ ternary "baseline" "restricted" $root }}
  annotations:
    # Uninstalling the release must never cascade into live desktops and their volumes.
    helm.sh/resource-policy: keep
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentconnect.fullname" . }}-computers-default-deny
  namespace: {{ $sandboxNamespace }}
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ['Ingress', 'Egress']
---
{{- end }}
{{- if ne $sandboxNamespace $agentsNamespace }}
# Members claim, sleep, wake and delete desktops here; the agents namespace's Role covers a pool that shares it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentconnect.fullname" . }}-daemon-pool-computers
  namespace: {{ $sandboxNamespace }}
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
rules:
  - apiGroups: ['extensions.agents.x-k8s.io']
    resources: ['sandboxclaims']
    verbs: ['get', 'list', 'watch', 'create', 'patch', 'delete']
  - apiGroups: ['extensions.agents.x-k8s.io']
    resources: ['sandboxwarmpools', 'sandboxtemplates']
    verbs: ['get']
  - apiGroups: ['agents.x-k8s.io']
    resources: ['sandboxes']
    verbs: ['get', 'list', 'watch', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentconnect.fullname" . }}-daemon-pool-computers
  namespace: {{ $sandboxNamespace }}
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: ac-cloud-daemon
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agentconnect.fullname" . }}-daemon-pool-computers
---
{{- end }}
{{- if and $root $ownNamespace }}
# `baseline` would also admit a root pod on the host's own ids, so every pod here must run in a user namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "agentconnect.fullname" . }}-computers-user-namespace
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
  validations:
    - expression: 'has(object.spec.hostUsers) && object.spec.hostUsers == false'
      message: 'pods in the desktops namespace must run in a user namespace (hostUsers: false)'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "agentconnect.fullname" . }}-computers-user-namespace
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
spec:
  policyName: {{ include "agentconnect.fullname" . }}-computers-user-namespace
  validationActions: ['Deny']
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $sandboxNamespace }}
---
{{- end }}
# Managed computers (computer-use.md §15.1): a member claims a desktop and pushes it a one-time registration.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: {{ include "agentconnect.computerTemplateName" . }}
  namespace: {{ $sandboxNamespace }}
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
    {{- include "agentconnect.componentLabels" (dict "ctx" . "component" "computer") | nindent 4 }}
spec:
  networkPolicyManagement: Managed
  networkPolicy:
    # Egress only: DNS, HTTPS, viewer media to the relays' TURN and STUN, and the egress proxy ports; ingress is the bootstrap policy below.
    egress:
      - ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
      - ports:
          - protocol: TCP
            port: 443
          {{- range (include "agentconnect.computerMediaPorts" . | fromJsonArray) }}
          - protocol: {{ .protocol }}
            port: {{ .port }}
          {{- end }}
      {{- if $pool.viewerPeerToPeerEgress }}
      # Hole-punched viewer media reaches the browser's public address on whatever UDP port its NAT chose.
      - to:
          {{- toYaml $pool.egressTo | nindent 10 }}
        ports:
          - protocol: UDP
      {{- end }}
      {{- with $pool.egressPorts }}
      # Proxy ports reach only egressTo (public addresses by default), never the cluster's own 8080 listeners.
      - to:
          {{- toYaml $pool.egressTo | nindent 10 }}
        ports:
          {{- range . }}
          - protocol: TCP
            port: {{ . }}
          {{- end }}
      {{- end }}
  envVarsInjectionPolicy: Disallowed
  volumeClaimTemplatesPolicy: Disallowed
  podTemplate:
    metadata:
      labels:
        # From birth, so a warm spare is already inside the bootstrap ingress policy.
        agentconnect.md/computer-pod: 'true'
    spec:
      automountServiceAccountToken: false
      {{- with $pool.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $root }}
      # Root in the pod is an unprivileged id on the node; no fsGroup, which would regroup the system directories and clear sudo's setuid bit.
      hostUsers: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- else }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      {{- with $pool.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pool.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $root }}
      initContainers:
        # Copies the image's system to the volume on the first start and writes the sudo rule (computer-use.md §3.8).
        - name: system
          image: {{ include "agentconnect.computerImage" . | quote }}
          command: ['/opt/agentconnect/seed-system.sh', '/volume']
          # The image's working directory is the user's home, which the runtime could not enter as root in a user namespace.
          workingDir: /
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
              add: ['CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID']
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: home
              mountPath: /volume
      {{- end }}
      # One container only: the pod's loopback holds the browser's DevTools endpoint, which any other container could reach.
      containers:
        - name: computer
          image: {{ include "agentconnect.computerImage" . | quote }}
          env:
            - name: AGENTCONNECT_CP_URL
              value: {{ include "agentconnect.publicCpUrl" . | quote }}
            # Pool mode: wait for the member's registration push instead of a token in the env.
            - name: AGENTCONNECT_POOL_BOOTSTRAP_PORT
              value: {{ $pool.bootstrapPort | quote }}
            - name: RESOLUTION
              value: {{ $pool.resolution | quote }}
          ports:
            - name: bootstrap
              containerPort: {{ $pool.bootstrapPort }}
          # Ready once the bootstrap listens, so a warm spare is claimable before it is registered.
          readinessProbe:
            tcpSocket:
              port: bootstrap
            periodSeconds: 2
          securityContext:
            {{- if $root }}
            # The desktop still runs as the user; sudo's setuid bit and these capabilities are what root inside the user namespace may use.
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: true
            capabilities:
              drop: ['ALL']
              add: ['CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'SETUID', 'SETGID', 'KILL', 'AUDIT_WRITE']
            {{- else }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            {{- end }}
          resources:
            {{- toYaml $pool.resources | nindent 12 }}
          volumeMounts:
            {{- if $root }}
            - name: home
              mountPath: /home/computer
              subPath: home
            {{- range list "usr" "etc" "var" }}
            - name: home
              mountPath: /{{ . }}
              subPath: system/{{ . }}
            {{- end }}
            {{- else }}
            - name: home
              mountPath: /home/computer
            {{- end }}
            - name: shm
              mountPath: /dev/shm
      volumes:
        # Google Chrome needs more shared memory than the runtime's 64 MiB default.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
  # The desktop's home: deleting the claim deletes it, which is how an ephemeral desktop is wiped.
  volumeClaimTemplates:
    - metadata:
        name: home
      spec:
        accessModes: ['ReadWriteOnce']
        storageClassName: {{ $pool.home.storageClass | quote }}
        resources:
          requests:
            storage: {{ $pool.home.size | quote }}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: {{ include "agentconnect.computerWarmPoolName" . }}
  namespace: {{ $sandboxNamespace }}
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
    {{- include "agentconnect.componentLabels" (dict "ctx" . "component" "computer") | nindent 4 }}
spec:
  replicas: {{ $pool.warmReplicas }}
  sandboxTemplateRef:
    name: {{ include "agentconnect.computerTemplateName" . }}
  updateStrategy:
    type: Recreate
---
# Only daemon-pool members reach a desktop's bootstrap; the registration it takes is a credential.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentconnect.fullname" . }}-computer-bootstrap
  namespace: {{ $sandboxNamespace }}
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      agentconnect.md/computer-pod: 'true'
  policyTypes: ['Ingress']
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
          podSelector:
            matchLabels:
              {{- include "agentconnect.selectorLabels" (dict "ctx" . "component" "daemon-pool") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $pool.bootstrapPort }}
{{- end }}
