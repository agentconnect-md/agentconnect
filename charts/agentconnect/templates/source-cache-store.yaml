{{- /* Bundled Source Cache store (chart README "Bundled store"): RustFS, its setup Job, the key pair Secret, and the https route. */ -}}
{{- if include "agentconnect.sourceCacheStore" . }}
{{- $sourceCache := .Values.sourceCache }}
{{- $store := $sourceCache.store }}
{{- $name := printf "%s-source-cache-store" (include "agentconnect.fullname" .) }}
{{- $image := printf "%s:%s" $store.image $store.tag }}
{{- /* Generated once and read back on upgrade, so the key pair stays stable across releases. */}}
{{- $secretKey := randAlphaNum 40 }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- $secretKey = index .data "AWS_SECRET_ACCESS_KEY" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
    {{- include "agentconnect.componentLabels" (dict "ctx" . "component" "source-cache-store") | nindent 4 }}
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ "agentconnect-source-cache" | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $secretKey | b64enc | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-setup
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
    {{- include "agentconnect.componentLabels" (dict "ctx" . "component" "source-cache-store-setup") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  object-store-setup.sh: |-
    {{- .Files.Get "files/object-store-setup.sh" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
    {{- include "agentconnect.componentLabels" (dict "ctx" . "component" "source-cache-store") | nindent 4 }}
spec:
  selector:
    {{- include "agentconnect.selectorLabels" (dict "ctx" . "component" "source-cache-store") | nindent 4 }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
    {{- include "agentconnect.componentLabels" (dict "ctx" . "component" "source-cache-store") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentconnect.selectorLabels" (dict "ctx" . "component" "source-cache-store") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentconnect.labels" . | nindent 8 }}
        {{- include "agentconnect.componentLabels" (dict "ctx" . "component" "source-cache-store") | nindent 8 }}
      annotations:
        # A changed key pair only takes effect when RustFS restarts.
        checksum/keys: {{ $secretKey | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: rustfs
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: AWS_ACCESS_KEY_ID
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: AWS_SECRET_ACCESS_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          resources:
            {{- toYaml $store.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        {{- with $store.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $store.persistence.size | quote }}
---
# Idempotent bucket setup after every install and upgrade; members re-read the lifecycle rules at start and every 6 hours.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-setup
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
    {{- include "agentconnect.componentLabels" (dict "ctx" . "component" "source-cache-store-setup") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # Kept after it finishes so its log stays readable until the next upgrade replaces it.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "agentconnect.labels" . | nindent 8 }}
        {{- include "agentconnect.componentLabels" (dict "ctx" . "component" "source-cache-store-setup") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      volumes:
        - name: setup
          configMap:
            name: {{ $name }}-setup
      containers:
        - name: setup
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          command: ['sh', '/setup/object-store-setup.sh']
          env:
            - name: AC_STORE_URL
              value: {{ printf "http://%s:9000" $name | quote }}
            - name: AC_STORE_BUCKET
              value: {{ $store.bucket | quote }}
            - name: AC_STORE_PREFIX
              value: {{ $sourceCache.prefix | default "" | quote }}
            - name: AC_STORE_CORS_ORIGIN
              value: {{ required "publicUrl is required for the bundled Source Cache store's browser CORS" .Values.publicUrl | trimSuffix "/" | quote }}
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: AWS_ACCESS_KEY_ID
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: setup
              mountPath: /setup
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
{{- if .Values.route.enabled }}
---
# The store's https:// origin: TLS terminates at the edge, and the S3 API keeps the client's Host, which every signature covers.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
    {{- include "agentconnect.componentLabels" (dict "ctx" . "component" "source-cache-store") | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
      sectionName: {{ .Values.route.gateway.sectionName }}
  hostnames:
    - {{ $store.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $name }}
          port: 9000
{{- end }}
{{- end }}
