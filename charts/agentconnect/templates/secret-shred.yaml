{{- if .Values.controlPlane.shred.enabled }}
# Crypto-shred workload: destroys the Vault transit key of every deleted organization.
#
# WHY THIS IS A SEPARATE WORKLOAD, NOT A CP FEATURE. Vault roles bind to a
# ServiceAccount, so a role granting key deletion that was bound to the CP's SA
# would leave that capability reachable from the control plane itself — the
# separation has to be the workload. Hence its own SA here, its own Vault role,
# and its own credential (SECRET_SHRED_VAULT_JWT_ROLE); the CLI deliberately
# refuses to fall back to the CP's.
#
# Its Vault policy is the narrowest thing that can do the job — `delete` on the
# org-key glob and `update` on that glob's `config` sub-path, and NOTHING else.
# In particular NO `list`: the shredder derives every key name from a tombstone
# this deployment wrote, and a list capability cannot be prefix-restricted, so
# granting it would expose every other org key sharing the transit mount — which
# is the normal case when one mount serves more than one install.
#
# Disabled by default. An unconfigured deployment simply accumulates
# unreferenced keys, which is the safe direction to fail.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentconnect.secretShredServiceAccountName" . }}
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
    {{- include "agentconnect.componentLabels" (dict "ctx" . "component" "secret-shred") | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "agentconnect.fullname" . }}-secret-shred
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
    {{- include "agentconnect.componentLabels" (dict "ctx" . "component" "secret-shred") | nindent 4 }}
spec:
  schedule: {{ .Values.controlPlane.shred.schedule | quote }}
  # Never two shredders at once: the second would read the same tombstones and
  # race the first's destroy/clear pair. The work is not urgent — a skipped tick
  # is picked up by the next one.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  # Keep failures around: a tombstone that will not drain is the signal that a
  # deletion promise is outstanding.
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # The CLI is idempotent and leaves undrained tombstones in place, so a
      # retry is always safe; bound it so a persistent Vault outage does not
      # spin.
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "agentconnect.labels" . | nindent 12 }}
            {{- include "agentconnect.componentLabels" (dict "ctx" . "component" "secret-shred") | nindent 12 }}
        spec:
          restartPolicy: Never
          # Its OWN identity — this is the whole point (see above).
          serviceAccountName: {{ include "agentconnect.secretShredServiceAccountName" . }}
          automountServiceAccountToken: true
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: secret-shred
              # The CP image: the CLI compiles into dist/ and ships with it, so
              # the shred logic stays version-locked to the schema and the key
              # naming it was written against.
              image: "{{ .Values.image.registry }}/{{ .Values.controlPlane.image }}:{{ .Values.controlPlane.tag | default (include "agentconnect.imageTag" .) }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["node", "dist/secrets/shred-cli.js"]
              env:
                # Deliberately a SHORT env list: the CLI reads its own minimal
                # config, not the control plane's. No API_KEY_PEPPER, and none
                # of the CP's VAULT_* credentials.
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingSecret }}
                      key: {{ .Values.secrets.databaseUrlKey }}
                - name: VAULT_ADDR
                  value: {{ .Values.controlPlane.shred.vaultAddr | default (index .Values.controlPlane.config "VAULT_ADDR") | quote }}
                - name: SECRET_SHRED_VAULT_JWT_ROLE
                  value: {{ .Values.controlPlane.shred.vaultRole | quote }}
                - name: SECRET_SHRED_VAULT_AUTH_MOUNT
                  value: {{ .Values.controlPlane.shred.vaultAuthMount | quote }}
              resources:
                {{- toYaml .Values.controlPlane.shred.resources | nindent 16 }}
{{- end }}
