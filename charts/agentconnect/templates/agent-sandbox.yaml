{{- if .Values.installCRD }}
# The CONTROLLER half of the vendored agent-sandbox stack — its namespace, RBAC, webhook
# service and Deployment. The 4 CRDs live in crds/agent-sandbox.yaml instead, which Helm
# applies on FIRST INSTALL before resolving any templated custom resource (what lets one
# release bootstrap a fresh cluster) and never upgrades or deletes. Version, source URL
# and upstream digest are in the vendored file's header; re-vendor with
# scripts/vendor-agent-sandbox.mjs rather than editing it.
{{ .Files.Get "vendor/agent-sandbox.yaml" }}
---
# The controller's label allowlist REPLACES its built-in `sandbox.users.io` default,
# so both domains are named. Without ours it rejects every claim the daemon makes with
# InvalidMetadata; it reads the file once at startup, from a mount the vendored
# Deployment already declares (optional, so this ConfigMap is the whole opt-in).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-sandbox-config
  namespace: agent-sandbox-system
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
data:
  allowed-label-domains: sandbox.users.io,agentconnect.md
{{- end }}
