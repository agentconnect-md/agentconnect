{{- if .Values.controlPlane.serviceAccount.create }}
# Per-release ServiceAccount for the control-plane pod. Its projected token
# (auto-mounted at /var/run/secrets/kubernetes.io/serviceaccount/token) is the
# workload JWT the CP exchanges at Vault's kubernetes auth method when
# SECRET_CIPHER=vault-transit (agentconnect-md/agentconnect,
# packages/control-plane/src/secrets/vault-transit.ts). Bind a Vault role to this
# SA name and namespace and grant it only transit/{encrypt,decrypt} on this
# install's key. Absent Vault, the SA is inert (pods just stop using `default`).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentconnect.controlPlaneServiceAccountName" . }}
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
    {{- include "agentconnect.componentLabels" (dict "ctx" . "component" "control-plane") | nindent 4 }}
{{- end }}
{{- if and .Values.setupServer.enabled .Values.setupServer.serviceAccount.name }}
---
# Dedicated identity for the Setup Server, so it stops inheriting whatever the control plane's
# own account is granted. Its name must already be bound in your Vault role or the pod
# fail-fasts on its first secret operation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.setupServer.serviceAccount.name }}
  labels:
    {{- include "agentconnect.labels" . | nindent 4 }}
{{- end }}
