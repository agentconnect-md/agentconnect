# Namespaced permissions: the CRs it reconciles and its election Lease.
# The operator has ZERO Secret verbs anywhere — an in-cluster daemon carries no
# credential at all, only the token the kubelet projects into its own pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentconnect-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ['agentconnect.md']
    resources: ['agentconnectorgs']
    verbs: ['get', 'list', 'watch', 'patch', 'update']
  - apiGroups: ['agentconnect.md']
    resources: ['agentconnectorgs/status']
    verbs: ['get', 'patch', 'update']
  - apiGroups: ['coordination.k8s.io']
    resources: ['leases']
    verbs: ['get', 'list', 'watch', 'create', 'update']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentconnect-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-operator
    namespace: {{ .Release.Namespace }}
---
# Cluster-scoped permissions for the org envelopes this install owns. Every
# write is admission-fenced to the install's namespace prefix by the envelope
# fence in validating-admission-policies.yaml; no Secret verbs, ever. Server-side
# apply needs create+patch on everything the operator stamps; delete covers the
# finalizer teardown.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-operator-envelope
  labels:
    app.kubernetes.io/name: agentconnect-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ['']
    resources:
      - namespaces
      - serviceaccounts
      - services
      - persistentvolumeclaims
      - resourcequotas
      - limitranges
    verbs: ['get', 'list', 'watch', 'create', 'patch', 'delete']
  # Read-only: the org-labeled secondary watch, and the suspend drain's "pods gone" check.
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['apps']
    resources: ['deployments']
    verbs: ['get', 'list', 'watch', 'create', 'patch', 'delete']
  - apiGroups: ['networking.k8s.io']
    resources: ['networkpolicies']
    verbs: ['get', 'list', 'watch', 'create', 'patch', 'delete']
  - apiGroups: ['rbac.authorization.k8s.io']
    resources: ['roles', 'rolebindings', 'clusterrolebindings']
    verbs: ['get', 'list', 'watch', 'create', 'patch', 'delete']
  # The daemon Role's own verbs: granting them requires holding them (no escalate),
  # and teardown deletes claims directly.
  - apiGroups: ['extensions.agents.x-k8s.io']
    resources: ['sandboxclaims']
    verbs: ['get', 'list', 'watch', 'create', 'delete', 'deletecollection']
  - apiGroups: ['extensions.agents.x-k8s.io']
    resources: ['sandboxtemplates', 'sandboxwarmpools']
    verbs: ['get', 'list', 'watch', 'create', 'patch', 'delete', 'deletecollection']
  # patch on sandboxes is the rollout drain handshake plus the teardown quiesce.
  - apiGroups: ['agents.x-k8s.io']
    resources: ['sandboxes']
    verbs: ['get', 'list', 'watch', 'patch']
  # bind is pinned to the install's tokenreview ClusterRole — the one CRB the envelope grants.
  - apiGroups: ['rbac.authorization.k8s.io']
    resources: ['clusterroles']
    verbs: ['bind']
    resourceNames: ['{{ .Release.Name }}-ac-tokenreview']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-operator-envelope
  labels:
    app.kubernetes.io/name: agentconnect-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-operator-envelope
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-operator
    namespace: {{ .Release.Namespace }}
