# Namespaced permissions: the CRs it reconciles and its election Lease.
# The operator has ZERO Secret verbs anywhere — credentials reach workloads
# via required volume mounts written by the key authority.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentconnect-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ['agentconnect.md']
    resources: ['agentconnectorgs']
    verbs: ['get', 'list', 'watch', 'patch', 'update']
  - apiGroups: ['agentconnect.md']
    resources: ['agentconnectorgs/status']
    verbs: ['get', 'patch', 'update']
  - apiGroups: ['coordination.k8s.io']
    resources: ['leases']
    verbs: ['get', 'list', 'watch', 'create', 'update']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentconnect-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-operator
    namespace: {{ .Release.Namespace }}
---
# Cluster-scoped permissions for the org envelopes this install owns.
# TODO(operator/chart): enumerate the envelope verbs per the operator design doc —
# namespaces (create/adopt), serviceaccounts, roles/rolebindings,
# networkpolicies, resourcequotas/limitranges, sandboxtemplates/sandboxwarmpools,
# persistentvolumeclaims, deployments, services, pods (get/list/watch only),
# sandboxes (get/list/watch/patch), plus `bind` pinned by resourceNames to the
# install's tokenreview ClusterRole. Every write is admission-fenced to the
# install's namespace prefix; no Secret verbs, ever.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-operator-envelope
  labels:
    app.kubernetes.io/name: agentconnect-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-operator-envelope
  labels:
    app.kubernetes.io/name: agentconnect-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-operator-envelope
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-operator
    namespace: {{ .Release.Namespace }}
