apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentconnect-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Two replicas, one leader — the Lease elector serializes reconciles.
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentconnect-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentconnect-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-operator
      containers:
        - name: operator
          image: '{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag | default .Chart.AppVersion }}'
          env:
            - name: AC_ORG_NAMESPACE_PREFIX
              value: {{ .Values.orgNamespacePrefix | quote }}
            - name: AC_TOKENREVIEW_CLUSTERROLE
              value: {{ .Release.Name }}-ac-tokenreview
            - name: AC_MASTER_TEMPLATE_PREFIX
              value: {{ .Values.masterTemplatePrefix | quote }}
            {{- /* Where this deployment's control plane and relay run, so an org's daemon may reach
                   them on their own service ports. Unset means the release namespace, which is what
                   the operator hard-coded before; an explicit empty list means no in-cluster peer,
                   leaving the daemon on the 443 rule alone. `kindIs`, not `default`: sprig reads an
                   empty list as absent, and the two mean different things here. */}}
            {{- $daemonEgress := .Values.daemonEgressNamespaces }}
            {{- if kindIs "invalid" $daemonEgress }}
            {{- $daemonEgress = list .Release.Namespace }}
            {{- end }}
            - name: AC_DAEMON_EGRESS_NAMESPACES
              value: {{ join "," $daemonEgress | quote }}
            {{- /* Unset when empty: the operator then leaves the daemon PVC on the cluster default class. */}}
            {{- with .Values.daemonStorage.className }}
            - name: AC_DAEMON_STORAGE_CLASS
              value: {{ . | quote }}
            {{- end }}
            - name: AC_DAEMON_STORAGE_SIZE
              value: {{ .Values.daemonStorage.size | quote }}
            - name: AC_RESYNC_INTERVAL_SECONDS
              value: {{ .Values.operator.resyncIntervalSeconds | quote }}
            - name: AC_LEASE_NAME
              value: {{ .Values.operator.leaseName | quote }}
            - name: AC_WATCH_TIMEOUT_SECONDS
              value: {{ .Values.operator.watchTimeoutSeconds | quote }}
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.operator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
