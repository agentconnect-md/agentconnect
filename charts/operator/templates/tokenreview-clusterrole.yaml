# Per-install (release-prefixed) ClusterRole letting each org's daemon SA
# create TokenReviews — the API is cluster-scoped, a namespaced Role cannot
# grant it. The operator creates one ClusterRoleBinding per org against this
# role; its `bind` permission is pinned to exactly this name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-ac-tokenreview
  labels:
    app.kubernetes.io/name: agentconnect-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ['authentication.k8s.io']
    resources: ['tokenreviews']
    verbs: ['create']
{{- if .Values.controlPlane.serviceAccountName }}
---
# The same verb for the control plane, which reviews an in-cluster daemon's projected
# ServiceAccount token on every connect (docs/designs/agentconnect-org-operator.md,
# "Daemon identity"). Rendered only when the install names the control plane's SA;
# otherwise granting it stays the deployment's own job.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-ac-tokenreview-control-plane
  labels:
    app.kubernetes.io/name: agentconnect-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-ac-tokenreview
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controlPlane.serviceAccountName }}
    namespace: {{ .Values.controlPlane.namespace | default .Release.Namespace }}
{{- end }}
