# Refuses uninstall while AgentConnectOrg CRs remain: deleting this release
# would remove the only actor able to run their finalizers, deadlocking every
# org teardown. Delete (and wait out) all CRs first.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-operator-pre-delete
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agentconnect-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: pre-delete
    # A failed hook Job survives on purpose: `kubectl logs` on it is the diagnosis.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  # An unreachable API server must fail the uninstall, not hang it.
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentconnect-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      # The operator's own SA: listing the CRs is a permission it already holds.
      serviceAccountName: {{ .Release.Name }}-operator
      containers:
        - name: guard
          image: '{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag | default .Chart.AppVersion }}'
          # tini is ENTRYPOINT, so args must name the interpreter. The subcommand reads
          # nothing but the in-cluster identity, hence no env from the operator's install.
          args: ['node', 'dist/index.js', 'preflight-uninstall']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
