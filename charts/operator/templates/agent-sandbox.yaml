{{- if .Values.installCRD }}
# The agent-sandbox stack this operator builds on — CRDs, controller, its namespace
# and RBAC — pinned and vendored, because upstream publishes release manifests but no
# chart to any registry. Version, source URL and upstream digest are in the vendored
# file's header; re-vendor with scripts/vendor-agent-sandbox.mjs. Its CRDs carry
# helm.sh/resource-policy: keep, like ours, so no uninstall cascade-deletes live
# Sandboxes.
{{ .Files.Get "vendor/agent-sandbox.yaml" }}
---
# The controller's label allowlist REPLACES its built-in `sandbox.users.io` default,
# so both domains are named. Without ours it rejects every claim the daemon makes with
# InvalidMetadata; it reads the file once at startup, from a mount the vendored
# Deployment already declares (optional, so this ConfigMap is the whole opt-in).
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-sandbox-config
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: agentconnect-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  allowed-label-domains: sandbox.users.io,agentconnect.md
{{- end }}
