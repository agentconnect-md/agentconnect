# Install the cluster-shared pieces with this release: the AgentConnectOrg CRD
# and the vendored agent-sandbox stack (CRDs + controller). Set false when they
# are managed out-of-band — several environment releases sharing one cluster,
# or a cluster that already runs agent-sandbox.
installCRD: true

# Install-time constant: every org namespace this install owns starts with
# this prefix. Must be non-empty and must not overlap (either direction) with
# any other install's prefix or control namespace on the same cluster.
orgNamespacePrefix: ac-org-

# Master SandboxTemplates in the control namespace are named `<prefix><tier>`;
# the operator stamps a per-org copy for every tier in spec.runtime.tiers.
masterTemplatePrefix: ac-runtime-

# Namespaces an org's daemon may reach on any port — where this deployment's
# control plane and relay actually run. This is network REACHABILITY and nothing
# else: the control plane's ADDRESS reaches the daemon on the AgentConnectOrg,
# written by the control plane itself, and a NetworkPolicy cannot select a DNS
# name. Unset means the release namespace, which is what the operator assumed
# before this was configurable. Set it when the control plane runs elsewhere in
# the cluster; an explicit empty list leaves the daemon on the 443 egress rule
# alone, which is all a control plane outside the cluster needs.
daemonEgressNamespaces: null

# The per-org daemon state volume (transcripts + local state). Both settings are
# properties of the cluster, not of an org, and both apply when the claim is
# first created: Kubernetes rejects a class change on an existing PVC, so an
# org already provisioned keeps its volume until that volume is deleted.
daemonStorage:
  # StorageClass for the claim. Empty leaves it off, so the cluster default
  # applies. Set it when that default is a node-local provisioner: such a class
  # only binds where it has a path, so the claim fails wherever the scheduler
  # puts the daemon and the pod never starts. Name a cluster-wide class instead.
  className: ''
  size: 10Gi

# The control plane this install serves. It is deployed separately — nothing here
# creates it — but it verifies an in-cluster daemon's projected ServiceAccount token
# by creating a TokenReview, which is a cluster-scoped API and so a cluster-scoped
# grant. Naming its ServiceAccount here binds that grant with the rest of the
# install's RBAC; leaving it empty leaves the grant to the deployment.
controlPlane:
  serviceAccountName: ''
  # Namespace of that ServiceAccount. Empty = the release namespace.
  namespace: ''

operator:
  image:
    repository: ghcr.io/agentconnect-md/operator
    # Empty = the chart's appVersion (stamped by the release pipeline).
    tag: ''
  replicas: 2
  resyncIntervalSeconds: 600
  leaseName: agentconnect-operator
  watchTimeoutSeconds: 300
  # Raw container env entries appended to the operator's own. The operator needs
  # none of them; this is where an install points OpenTelemetry at its own
  # collector (see the chart README). Telemetry stays off while this is empty.
  extraEnv: []
