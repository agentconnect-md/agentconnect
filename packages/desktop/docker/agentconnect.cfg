// AgentConnect desktop image: in a managed pod the browser leaves only through the daemon's egress forwarder (computer-use.md §15.4).
var port = getenv("AGENTCONNECT_EGRESS_PORT");
if (port) {
  var p = parseInt(port, 10);
  lockPref("network.proxy.type", 1);
  lockPref("network.proxy.http", "127.0.0.1");
  lockPref("network.proxy.http_port", p);
  lockPref("network.proxy.ssl", "127.0.0.1");
  lockPref("network.proxy.ssl_port", p);
  lockPref("network.proxy.share_proxy_settings", true);
  lockPref("network.proxy.no_proxies_on", "");
  lockPref("network.proxy.allow_hijacking_localhost", true);
  lockPref("network.proxy.failover_direct", false);
  lockPref("network.trr.mode", 5);
  lockPref("media.peerconnection.ice.proxy_only", true);
}
