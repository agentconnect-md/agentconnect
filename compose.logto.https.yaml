services:
  logto-db-init:
    environment:
      PGPASSWORD: '${AGENTCONNECT_POSTGRES_PASSWORD:?set AGENTCONNECT_POSTGRES_PASSWORD before enabling HTTPS}'
      LOGTO_POSTGRES_PASSWORD: '${LOGTO_POSTGRES_PASSWORD:?set LOGTO_POSTGRES_PASSWORD before enabling HTTPS}'

  logto:
    ports: !reset []
    environment:
      DB_URL: 'postgresql://logto:${LOGTO_POSTGRES_PASSWORD:?set LOGTO_POSTGRES_PASSWORD before enabling HTTPS}@postgres:5432/logto'
      ENDPOINT: 'https://${AGENTCONNECT_HTTPS_HOST}:${AGENTCONNECT_LOGTO_HTTPS_PORT}'
      ADMIN_ENDPOINT: 'http://localhost:${AGENTCONNECT_LOGTO_ADMIN_PORT:-3002}'
      TRUST_PROXY_HEADER: 'true'

  control-plane:
    environment:
      OIDC_ISSUER: 'https://${AGENTCONNECT_HTTPS_HOST}:${AGENTCONNECT_LOGTO_HTTPS_PORT}/oidc'
      LOGTO_ENDPOINT: 'https://${AGENTCONNECT_HTTPS_HOST}:${AGENTCONNECT_LOGTO_HTTPS_PORT}'
      LOGTO_MGMT_ENDPOINT: 'http://logto:3001'

  web:
    environment:
      LOGTO_ENDPOINT: 'https://${AGENTCONNECT_HTTPS_HOST}:${AGENTCONNECT_LOGTO_HTTPS_PORT}'

  # Setup accepts origins only, so give it bare gateway origins rather than the
  # final /cp and /relay routes used by the other services.
  setup-server:
    environment:
      SETUP_SERVER_URL: 'http://localhost:${AGENTCONNECT_SETUP_PORT:-8091}'
      LOGTO_ADMIN_ENDPOINT: 'http://localhost:${AGENTCONNECT_LOGTO_ADMIN_PORT:-3002}'
      LOGTO_MGMT_ENDPOINT: 'http://logto:3001'
      OIDC_ISSUER: 'https://${AGENTCONNECT_HTTPS_HOST}:${AGENTCONNECT_LOGTO_HTTPS_PORT}/oidc'
      AGENTCONNECT_PUBLIC_WEB_URL: 'https://${AGENTCONNECT_HTTPS_HOST}:${AGENTCONNECT_HTTPS_PORT}'
      AGENTCONNECT_PUBLIC_CP_URL: 'https://${AGENTCONNECT_HTTPS_HOST}:${AGENTCONNECT_HTTPS_PORT}'
      AGENTCONNECT_PUBLIC_RELAY_URL: 'https://${AGENTCONNECT_HTTPS_HOST}:${AGENTCONNECT_HTTPS_PORT}'

  caddy:
    depends_on:
      logto:
        condition: service_healthy
    ports:
      - '${AGENTCONNECT_HTTPS_BIND_ADDRESS:-0.0.0.0}:${AGENTCONNECT_LOGTO_HTTPS_PORT}:8443'
      - '127.0.0.1:${AGENTCONNECT_LOGTO_ADMIN_PORT:-3002}:3002'
      - '127.0.0.1:${AGENTCONNECT_SETUP_PORT:-8091}:8091'
    networks:
      - default
      - admin

configs:
  caddyfile:
    content: |
      {
          # IP-address clients do not consistently send SNI. Select the
          # certificate for this IP when the ClientHello omits it.
          default_sni ${AGENTCONNECT_HTTPS_HOST}
      }

      https://${AGENTCONNECT_HTTPS_HOST} {
          tls internal

          handle_path /cp/* {
              reverse_proxy control-plane:8080
          }

          handle_path /relay/* {
              reverse_proxy relay:8080
          }

          handle {
              reverse_proxy web:8080
          }
      }

      https://${AGENTCONNECT_HTTPS_HOST}:8443 {
          tls internal
          reverse_proxy logto:3001 {
              header_up X-Forwarded-Proto https
          }
      }

      http://:3002 {
          reverse_proxy logto:3002
      }

      http://:8091 {
          reverse_proxy setup-server:8091
      }
